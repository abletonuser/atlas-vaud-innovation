name: Diagnostic ARAMIS
on:
  workflow_dispatch:
  push:
    paths: ["tools/diag/diag_aramis.py"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python tools/diag/diag_aramis.py > tools/diag/resultat.txt 2>&1 || true
      - run: |
          git config user.name "atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/diag/resultat.txt && git commit -m "Diagnostic ARAMIS : résultat" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
